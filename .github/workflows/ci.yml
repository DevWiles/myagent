# 每次推送和 PR 跑一遍后端测试。在 Linux 上跑：Windows 下有几个和平台相关的用例
# （路径分隔符、POSIX 权限、进程树）会失败，见 issue「Windows 下 6 个与环境相关的测试失败」
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test
